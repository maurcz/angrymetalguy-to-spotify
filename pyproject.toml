[project]
name = "angrymetalguy-to-spotify"
version = "0.1.0"
description = "Parses \"Angry Metal Guy\" reviews and auto publishes albums with high scores to a spotify playlist"
authors = [
    { name = "Mauricio R. Cruz", email = "mauriciorcruz@gmail.com" },
]
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
    "spotipy>=2.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.8",
    "pytest>=9.1.1",
    "pdbpp>=0.12.1",
    "mypy>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["angrymetalguy_to_spotify"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Enable flake8 + isort rules (E/W = pycodestyle/pyflakes, I = isort)
select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
disallow_untyped_defs = true
